<svg xmlns="http://www.w3.org/2000/svg" width="590" height="380" viewBox="0 0 590 380" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B16"/><stop offset=".6" stop-color="#0C1428"/><stop offset="1" stop-color="#12203F"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" x2="1">
    <stop offset="0" stop-color="#9C7A36"/><stop offset=".5" stop-color="#F1D9A0"/><stop offset="1" stop-color="#9C7A36"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" x2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#C9A45C" stroke-opacity=".06"/>
  </pattern>
  <clipPath id="clip"><rect width="590" height="380" rx="18"/></clipPath>
</defs>
<style>
  .fade{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sheen{animation:sweep 8s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(0)}55%,100%{transform:translateX(2200px)}}
  .grid{animation:drift 22s linear infinite}
  @keyframes drift{to{transform:translate(40px,40px)}}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}

  .cube{animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .cur{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
</style>
<g clip-path="url(#clip)">
