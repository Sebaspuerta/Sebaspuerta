<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B16"/><stop offset=".6" stop-color="#0C1428"/><stop offset="1" stop-color="#12203F"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" x2="1">
    <stop offset="0" stop-color="#9C7A36"/><stop offset=".5" stop-color="#F1D9A0"/><stop offset="1" stop-color="#9C7A36"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" x2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#C9A45C" stroke-opacity=".06"/>
  </pattern>
  <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
</defs>
<style>
  .fade{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sheen{animation:sweep 8s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(0)}55%,100%{transform:translateX(2200px)}}
  .grid{animation:drift 22s linear infinite}
  @keyframes drift{to{transform:translate(40px,40px)}}
  .tw{animation:tw 3.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}

  .bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes grow{to{transform:scaleX(1)}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect class="grid" x="-40" y="-40" width="1280" height="380" fill="url(#grid)"/>
  <rect class="sheen" x="-500" y="0" width="500" height="300" fill="url(#sheen)"/>

  <text class="fade" x="48" y="62" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="6" fill="#C9A45C">RESUMEN EJECUTIVO</text>
  <text class="fade" style="animation-delay:.2s" x="48" y="102" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#F5F3EE">Convierto necesidades de negocio en software confiable, bien diseñado y listo para operar.</text>
  <g class="fade" style="animation-delay:0.50s">
    <rect x="48" y="132" width="352" height="140" rx="12" fill="#fff" fill-opacity=".025" stroke="#C9A45C" stroke-opacity=".22"/>
    <text x="72" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="url(#gold)">I</text>
    <text x="124" y="170" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#F5F3EE">Solución integral</text>
    <text x="72" y="212" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8E98AC">Del requerimiento del negocio</text><text x="72" y="232" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8E98AC">a la entrega en producción:</text><text x="72" y="252" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8E98AC">datos, backend, interfaz y nube.</text>
  </g>
  <rect class="bar" style="animation-delay:1.10s" x="72" y="184" width="304" height="1.5" fill="#C9A45C"/>
  <g class="fade" style="animation-delay:0.75s">
    <rect x="424" y="132" width="352" height="140" rx="12" fill="#fff" fill-opacity=".025" stroke="#C9A45C" stroke-opacity=".22"/>
    <text x="448" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="url(#gold)">II</text>
    <text x="500" y="170" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#F5F3EE">Calidad y trazabilidad</text>
    <text x="448" y="212" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8E98AC">Código limpio y mantenible,</text><text x="448" y="232" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8E98AC">respaldado por documentación</text><text x="448" y="252" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8E98AC">técnica rigurosa.</text>
  </g>
  <rect class="bar" style="animation-delay:1.35s" x="448" y="184" width="304" height="1.5" fill="#C9A45C"/>
  <g class="fade" style="animation-delay:1.00s">
    <rect x="800" y="132" width="352" height="140" rx="12" fill="#fff" fill-opacity=".025" stroke="#C9A45C" stroke-opacity=".22"/>
    <text x="824" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="url(#gold)">III</text>
    <text x="876" y="170" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#F5F3EE">IA con criterio</text>
    <text x="824" y="212" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8E98AC">IA aplicada de forma ética</text><text x="824" y="232" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8E98AC">y responsable para acelerar</text><text x="824" y="252" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8E98AC">resultados con control humano.</text>
  </g>
  <rect class="bar" style="animation-delay:1.60s" x="824" y="184" width="304" height="1.5" fill="#C9A45C"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="298.5" rx="18" fill="none" stroke="url(#gold)" stroke-opacity=".55" stroke-width="1.5"/>
</svg>